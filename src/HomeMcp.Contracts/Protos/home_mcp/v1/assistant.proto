syntax = "proto3";

option csharp_namespace = "HomeMcp.Contracts.V1";

package home_mcp.v1;

// gRPC is used ONLY for the bidirectional streaming conversation channel.
// All admin operations (plugins, sessions, setup) are served over HTTP REST.
// Device pairing is a one-time REST call (POST /api/v1/pair) before gRPC is opened.
service Assistant {
  rpc Converse(stream ClientEvent) returns (stream ServerEvent);
}

// ─── Client → Server ────────────────────────────────────────────────────────

message ClientEvent {
  oneof payload {
    HelloEvent hello = 1;
    TextInputEvent text = 2;
    HeartbeatEvent heartbeat = 3;
    InterruptEvent interrupt = 4;
  }
}

message HelloEvent {
  string device_id = 1;
  string device_token = 2;
  string client_version = 3;
  ClientCapabilities capabilities = 4;
  string locale = 5;
}

message ClientCapabilities {
  bool stt = 1;
  bool tts = 2;
  bool audio_playback = 3;
  bool media_player = 4;
  bool display = 5;
  bool wake_word = 6;
}

message TextInputEvent {
  string session_id = 1;
  string text = 2;
}

message HeartbeatEvent {
  int64 timestamp_ms = 1;
}

message InterruptEvent {
  string session_id = 1;
}

// ─── Server → Client ────────────────────────────────────────────────────────

message ServerEvent {
  oneof payload {
    SessionStartedEvent session_started = 1;
    TextDeltaEvent text_delta = 2;
    ToolCallStartedEvent tool_call_started = 3;
    ToolCallFinishedEvent tool_call_finished = 4;
    MediaPlayCommandEvent media_play = 5;
    TurnDoneEvent turn_done = 6;
    ErrorEvent error = 7;
  }
}

message SessionStartedEvent {
  string session_id = 1;
  string user_id = 2;
}

message TextDeltaEvent {
  string text = 1;
}

message ToolCallStartedEvent {
  string plugin_id = 1;
  string tool_name = 2;
}

message ToolCallFinishedEvent {
  string plugin_id = 1;
  string tool_name = 2;
  string result_json = 3;
}

message MediaPlayCommandEvent {
  string url = 1;
  string mime_type = 2;
  MediaMetadata metadata = 3;
}

message MediaMetadata {
  string title = 1;
  string artist = 2;
  string album = 3;
  string thumbnail_url = 4;
  int64 duration_ms = 5;
}

message TurnDoneEvent {
  TurnDoneReason reason = 1;
}

enum TurnDoneReason {
  TURN_DONE_REASON_UNSPECIFIED = 0;
  TURN_DONE_REASON_COMPLETED = 1;
  TURN_DONE_REASON_INTERRUPTED = 2;
  TURN_DONE_REASON_ERROR = 3;
}

message ErrorEvent {
  string code = 1;
  string message = 2;
}
