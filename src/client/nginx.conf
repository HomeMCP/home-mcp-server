# Serves the Angular admin SPA and reverse-proxies API calls to the backend.
# The admin UI only speaks REST — gRPC (Converse) is hit directly on the backend
# by external clients and never passes through nginx.

upstream backend {
    server server:5201;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Internal admin REST API
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # External pairing API (versioned)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — let Angular's router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
