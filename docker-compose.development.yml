# ─────────────────────────────────────────────────────────────────────────────
# Development stack — live hot-reload for BOTH the .NET backend and Angular UI.
#
#   docker compose -f docker-compose.development.yml up
#
# Backend  : `dotnet watch` recompiles on C# changes               → host :5201
# Admin UI : `ng serve` rebuilds + live-reloads on TS/HTML/SCSS    → host :4200
#
# Source is bind-mounted, so edits on the host are picked up instantly.
# No image build step — official SDK / Bun images run the watchers directly.
# Ollama is expected on the host; override its URL in .env.
# ─────────────────────────────────────────────────────────────────────────────

services:
  server:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo
    command: >
      dotnet watch
      --non-interactive
      --project src/HomeMcp.Server/HomeMcp.Server.csproj
      run
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5201
      Storage__Sqlite__Path: /repo/data/home-mcp.db
      Llm__OllamaUrl: ${OLLAMA_URL:-http://host.docker.internal:11434}
      Llm__ChatModel: ${CHAT_MODEL:-gemma4:26b}
      # Bind-mounted source on some hosts misses inotify events — poll instead.
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
    volumes:
      - ./:/repo
      - nuget_cache:/root/.nuget/packages
    ports:
      - "5201:5201"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    image: oven/bun:1
    working_dir: /app
    # Install deps (into the anonymous volume) then run the live dev server.
    command: >
      sh -c "bun install --frozen-lockfile &&
             bun run start --
             --host 0.0.0.0
             --port 4200
             --poll 1000
             --proxy-config proxy.conf.docker.json"
    depends_on:
      - server
    volumes:
      - ./src/client:/app
      - admin_node_modules:/app/node_modules   # keep container deps off the host
      - admin_angular_cache:/app/.angular       # keep build cache off the host
    ports:
      - "4200:4200"
    environment:
      NG_CLI_ANALYTICS: "false"

volumes:
  nuget_cache:
  admin_node_modules:
  admin_angular_cache:
